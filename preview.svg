<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">VisitBrief preview</title><desc id="desc">An appointment preparation worksheet beside a clean printable brief.</desc><rect width="1200" height="800" fill="#f5f3ed"/><rect x="50" y="36" width="1100" height="728" rx="22" fill="#fbfaf6" stroke="#d8e0d8"/><circle cx="92" cy="78" r="17" fill="#28645b"/><text x="86" y="85" font-family="Georgia,serif" font-size="21" fill="white">V</text><text x="121" y="84" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#213532">RandomVibez</text><text x="963" y="82" font-family="Arial,sans-serif" font-size="13" fill="#28645b">BROWSER-LOCAL · NO COOKIES</text><text x="90" y="149" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#c86f54">VISITBRIEF / APPOINTMENT PREP</text><text x="90" y="207" font-family="Georgia,serif" font-size="53" fill="#213532">Make room for what you want</text><text x="90" y="261" font-family="Georgia,serif" font-size="53" font-style="italic" fill="#28645b">to ask.</text><rect x="90" y="290" width="1020" height="64" rx="8" fill="#edf2e9" stroke="#d9e3d9"/><text x="111" y="317" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#213532">Your notes stay on this device.</text><text x="111" y="338" font-family="Arial,sans-serif" font-size="12" fill="#586b65">No cookies, tracking, uploads, or network calls. Exports and printouts are unencrypted.</text><rect x="90" y="382" width="496" height="325" rx="12" fill="#fffefa" stroke="#d8e0d8"/><text x="120" y="420" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#c86f54">YOUR NOTES</text><text x="120" y="454" font-family="Georgia,serif" font-size="27" fill="#213532">Build your brief</text><rect x="120" y="477" width="205" height="39" rx="5" fill="white" stroke="#cdd8d0"/><rect x="340" y="477" width="215" height="39" rx="5" fill="white" stroke="#cdd8d0"/><text x="121" y="470" font-family="Arial,sans-serif" font-size="10" fill="#485b56">Appointment date</text><text x="341" y="470" font-family="Arial,sans-serif" font-size="10" fill="#485b56">Appointment type</text><text x="120" y="553" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#485b56">My main concern or goal</text><rect x="120" y="562" width="435" height="56" rx="5" fill="white" stroke="#cdd8d0"/><text x="136" y="590" font-family="Arial,sans-serif" font-size="12" fill="#9ba8a0">What would you most like to discuss?</text><text x="120" y="655" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#485b56">Questions for the visit</text><rect x="120" y="665" width="435" height="26" rx="5" fill="white" stroke="#cdd8d0"/><rect x="612" y="382" width="498" height="325" rx="12" fill="#fffefa" stroke="#d8e0d8"/><text x="641" y="420" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#c86f54">LIVE PREVIEW</text><text x="641" y="454" font-family="Georgia,serif" font-size="27" fill="#213532">Your appointment brief</text><rect x="641" y="477" width="440" height="183" rx="4" fill="white" stroke="#e4e3d9"/><text x="665" y="505" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#c86f54">VISITBRIEF · APPOINTMENT NOTES</text><text x="665" y="537" font-family="Georgia,serif" font-size="23" fill="#213532">What I want to discuss</text><line x1="665" y1="552" x2="1057" y2="552" stroke="#e8e8df"/><text x="665" y="578" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#657770">MY MAIN CONCERN OR GOAL</text><text x="665" y="598" font-family="Arial,sans-serif" font-size="12" fill="#213532">A concise, personal starting point.</text><text x="665" y="633" font-family="Arial,sans-serif" font-size="9" fill="#8a968d">A personal conversation aid · In your own words</text><rect x="641" y="675" width="118" height="27" rx="5" fill="#28645b"/><text x="665" y="693" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="white">Print brief ↗</text><rect x="766" y="675" width="112" height="27" rx="5" fill="#f7faf6" stroke="#ccd9d1"/><text x="790" y="693" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#204f48">Export JSON</text></svg>
